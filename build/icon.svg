<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf9f4"/>
      <stop offset="1" stop-color="#e8e1d4"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b8263"/>
      <stop offset="1" stop-color="#15563f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#183d30" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#paper)"/>
  <g filter="url(#shadow)" transform="rotate(4 512 512)">
    <rect x="224" y="224" width="576" height="576" rx="176" fill="url(#green)"/>
    <rect x="353" y="353" width="318" height="318" rx="101" fill="#fbfaf6" transform="rotate(-9 512 512)"/>
    <rect x="421" y="421" width="182" height="182" rx="57" fill="#dcebe3"/>
  </g>
</svg>
