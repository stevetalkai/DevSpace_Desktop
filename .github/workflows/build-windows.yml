name: 构建 Windows 安装包

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 检查代码格式
        run: npm run lint

      - name: 检查类型
        run: npm run typecheck

      - name: 编译应用
        run: npm run build

      - name: 生成 Windows x64 安装包
        run: npx electron-builder --win nsis --x64 --publish never

      - name: 保存安装包
        uses: actions/upload-artifact@v4
        with:
          name: DevSpace-0.1.0-windows-x64
          path: dist/*.exe
          if-no-files-found: error
